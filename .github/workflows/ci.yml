name: Validate Skill

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check networkx pillow

      - name: Validate privacy-clean release
        run: python tools/validate_release.py

      - name: Run end-to-end tests
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s creator-clone-lab/tests -p "test_*.py" -v
